:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#222;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);--text:#f0f0f0;--text2:#888;--text3:#555;--green:#22c55e;--green-bg:rgba(34,197,94,0.12);--amber:#f59e0b;--amber-bg:rgba(245,158,11,0.12);--red:#ef4444;--red-bg:rgba(239,68,68,0.12);--blue:#3b82f6;--blue-bg:rgba(59,130,246,0.12);--accent:#22c55e;--radius:14px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0f0f0f}body{font-family:'DM Sans',sans-serif;background:#0f0f0f!important;color:var(--text);min-height:100vh;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#0f0f0f}
.header{padding:52px 20px 16px;background:var(--bg)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.header h1{font-size:26px;font-weight:600;letter-spacing:-0.5px}
.header-sub{font-size:13px;color:var(--text2)}
.header-badge{background:var(--green-bg);color:var(--green);font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;font-family:'DM Mono',monospace}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}
.metric{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;border:0.5px solid var(--border)}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.metric-val{font-size:22px;font-weight:600;letter-spacing:-0.5px}
.metric-val.green{color:var(--green)}.metric-val.amber{color:var(--amber)}.metric-val.red{color:var(--red)}
.tab-bar{display:flex;padding:0 20px 16px;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 16px;border:0.5px solid var(--border);border-radius:20px;background:none;color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;margin-right:8px;transition:all .2s;flex-shrink:0}
.tab-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}
.content{flex:1;padding:0 20px;padding-bottom:110px}
.section{display:none}.section.active{display:block}
.card{background:var(--bg2);border-radius:var(--radius);padding:16px;border:0.5px solid var(--border);margin-bottom:10px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-code{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);margin-bottom:2px}
.card-name{font-size:15px;font-weight:500}
.badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.gray{background:var(--bg3);color:var(--text2)}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:0.5px solid var(--border)}
.row-label{font-size:12px;color:var(--text2)}
.row-val{font-size:12px;font-weight:500;text-align:right;max-width:58%;word-break:break-all}
.pay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pay-cell{background:var(--bg2);border-radius:var(--radius-sm);padding:10px 12px;border:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.pay-cell.paid{background:var(--green-bg);border-color:rgba(34,197,94,0.25)}
.pay-cell.late{background:var(--red-bg);border-color:rgba(239,68,68,0.25)}
.pay-cell.late .pay-cell-code{color:var(--red)}
.pay-cell.late .pay-cell-status{color:var(--red);opacity:.8}
.pay-cell-code{font-family:'DM Mono',monospace;font-size:12px;font-weight:500}
.pay-cell.paid .pay-cell-code{color:var(--green)}
.pay-cell-status{font-size:10px;color:var(--text3)}
.pay-cell.paid .pay-cell-status{color:var(--green);opacity:.8}
.scad-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:0.5px solid var(--border)}
.scad-name{font-size:14px;font-weight:500;margin-bottom:2px}
.scad-sub{font-size:11px;color:var(--text2)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.pay-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:0.5px solid var(--border)}
.pay-apt{font-size:14px;font-weight:500}
.pay-date{font-size:11px;color:var(--text2);margin-top:2px}
.pay-amount{font-size:15px;font-weight:600;color:var(--green);font-family:'DM Mono',monospace}
.contact-card{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;border:0.5px solid var(--border);margin-bottom:8px}
.contact-name{font-size:14px;font-weight:500;margin-bottom:6px}
.contact-tel{font-size:13px;color:var(--text2);font-family:'DM Mono',monospace;margin-bottom:2px}
.contact-tel a{color:var(--blue);text-decoration:none}
.fab{position:fixed;bottom:90px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;font-size:26px;color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(34,197,94,0.4);z-index:50;transition:transform .15s}
.fab:active{transform:scale(0.92)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(15,15,15,0.97);backdrop-filter:blur(20px);border-top:0.5px solid var(--border);padding:8px 0 24px;display:flex;justify-content:space-around;z-index:40}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border:none;background:none;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:10px;transition:color .2s;flex:1}
.nav-item.active{color:var(--accent)}
.nav-icon{font-size:20px;line-height:1}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 20px 44px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-top:0.5px solid var(--border2)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.modal h3{font-size:18px;font-weight:600;margin-bottom:20px;letter-spacing:-0.3px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:13px 14px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-cancel{flex:1;padding:15px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:none;color:var(--text2);font-size:15px;font-family:'DM Sans',sans-serif;cursor:pointer}
.btn-save{flex:2;padding:15px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#000;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer}
.import-box{background:var(--bg2);border:1.5px dashed var(--border2);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.import-box p{font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.6}
.import-box textarea{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;color:var(--text);font-size:12px;font-family:'DM Mono',monospace;resize:vertical;min-height:80px;outline:none}
.sec-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 10px;font-weight:500}
.edit-btn{font-size:16px;padding:6px;border:none;background:none;color:var(--text2);cursor:pointer;border-radius:6px}
.del-btn{font-size:12px;padding:4px 10px;border:0.5px solid var(--border);border-radius:6px;background:none;color:var(--text3);font-family:'DM Sans',sans-serif;cursor:pointer}
.del-btn:active{background:var(--red-bg);color:var(--red)}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.add-btn-full{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 16px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:none;cursor:pointer;font-size:14px;color:var(--text2);font-family:'DM Sans',sans-serif;margin-bottom:14px;width:100%}
.filters{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border:0.5px solid var(--border);border-radius:20px;background:none;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}
@media(min-width:481px){.app{border-left:0.5px solid var(--border);border-right:0.5px solid var(--border)}}

  </div>
</div>

function save(){cloudSave(data);}
function today(){return new Date().toISOString().split('T')[0];}
function daysTo(d){return Math.round((new Date(d)-new Date(today()))/86400000);}
function scadBadge(d){const n=daysTo(d);if(n<0)return{cls:'red',txt:'Scaduta'};if(n<=30)return{cls:'red',txt:n+'gg'};if(n<=90)return{cls:'amber',txt:n+'gg'};return{cls:'green',txt:n+'gg'};}
function fmtDate(d){if(!d)return'-';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`;}
function aptLabel(id){if(id===0)return'Generale';const a=data.appartamenti.find(x=>x.id===id);return a?`${a.code} - ${a.tenant.split('/')[0].trim().split(' ').slice(0,2).join(' ')}`:'?';}
function fmtAmt(n){return'euro '+n.toLocaleString('it',{minimumFractionDigits:2,maximumFractionDigits:2});}

function showTab(t,tabEl,navId){

  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));

  document.getElementById(t).classList.add('active');

  const ne=document.getElementById(nid);
  if(ne)ne.classList.add('active');

function renderMetrics(){

  const tot=data.appartamenti.length;
  const now=new Date();
  const monthLabel=MONTHS[now.getMonth()]+' '+now.getFullYear();
  const paidNow=data.pagamenti.filter(p=>p.month===monthLabel).length;
  const urgScad=data.scadenze.filter(s=>daysTo(s.date)<=30&&daysTo(s.date)>=0).length;
  const scadute=data.scadenze.filter(s=>daysTo(s.date)<0).length;
  const totRent=data.appartamenti.filter(a=>a.rent>0&&a.status==='affittato').reduce((s,a)=>s+a.rent,0);
  document.getElementById('metrics-bar').innerHTML=`
    <div class="metric"><div class="metric-label">Affittati</div><div class="metric-val">${aff}/${tot}</div></div>
    <div class="metric"><div class="metric-label">Pagati (${MONTHS[now.getMonth()].slice(0,3)})</div><div class="metric-val ${paidNow<aff?'amber':''}">${paidNow}/${aff}</div></div>

  document.getElementById('hdr-badge').textContent=tot+' unita';
}

function importApts(){
  const txt=document.getElementById('import-text').value.trim();
  if(!txt)return;
  let count=0;
  txt.split('\n').filter(l=>l.trim()).forEach(line=>{
    const p=line.split('|').map(x=>x.trim());
    if(p.length>=2){data.appartamenti.push({id:data.nextId++,code:p[0]||'?',tenant:p[1]||'',tel:p[2]||'',email:'',rent:parseFloat(p[3])||0,day:5,exp:'',status:'affittato',cauzione:0,note:''});count++;}
  });
  save();
  document.getElementById('import-result').innerHTML=`<p style="color:var(--green);font-size:13px;margin-top:8px">${count} appartamenti importati!</p>`;
  document.getElementById('import-text').value='';
  renderMetrics();
}

function resetData(){
  if(confirm('Sei sicuro? Tutti i dati aggiunti manualmente saranno persi.')){
    data=JSON.parse(JSON.stringify(DEFAULT));save();renders.importa();renderMetrics();
  }
}

function openAptModal(id){
  editingAptId=id||null;
  document.getElementById('modal-apt-title').textContent=id?'Modifica appartamento':'Nuovo appartamento';
  if(id){
    const a=data.appartamenti.find(x=>x.id===id);
    document.getElementById('f-code').value=a.code;
    document.getElementById('f-ten').value=a.tenant;
    document.getElementById('f-tel').value=a.tel;
    document.getElementById('f-email').value=a.email;
    document.getElementById('f-rent').value=a.rent||'';
    document.getElementById('f-day').value=a.day;
    document.getElementById('f-exp').value=a.exp;
    document.getElementById('f-status').value=a.status;
    document.getElementById('f-cau').value=a.cauzione||'';
    document.getElementById('f-url').value=a.url||'';
    document.getElementById('f-val').value=a.value||'';
    document.getElementById('f-note').value=a.note||'';
  } else {
    ['f-code','f-ten','f-tel','f-email','f-rent','f-cau','f-url','f-val','f-note'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-day').value=5;
    document.getElementById('f-exp').value='';
    document.getElementById('f-status').value='affittato';
  }
  document.getElementById('modal-apt').classList.add('open');
}

function openModal(t){
  if(t==='apt'){openAptModal();return;}
  const opts=data.appartamenti.map(a=>`<option value="${a.id}">${a.code} - ${a.tenant.split('/')[0].trim().split(' ').slice(0,2).join(' ')}</option>`).join('');
  if(t==='pay'){
    document.getElementById('p-apt').innerHTML=opts;
    document.getElementById('p-date').value=today();
    document.getElementById('p-amt').value='';
    document.getElementById('p-note').value='';
  }
  if(t==='scad'){
    document.getElementById('s-apt').innerHTML='<option value="0">Tutti gli appartamenti</option>'+opts;
    document.getElementById('s-date').value='';
    document.getElementById('s-note').value='';
  }
  if(t==='spesa'){
    document.getElementById('sp-apt').innerHTML='<option value="0">Generale</option>'+opts;
    document.getElementById('sp-date').value=today();
    document.getElementById('sp-amt').value='';
    document.getElementById('sp-desc').value='';
  }
  document.getElementById('modal-'+t).classList.add('open');
}

function closeModal(t){document.getElementById('modal-'+t).classList.remove('open');}

function saveApt(){
  const a={id:editingAptId||data.nextId++,code:document.getElementById('f-code').value||'?',tenant:document.getElementById('f-ten').value||'',tel:document.getElementById('f-tel').value||'',email:document.getElementById('f-email').value||'',rent:parseFloat(document.getElementById('f-rent').value)||0,day:parseInt(document.getElementById('f-day').value)||5,exp:document.getElementById('f-exp').value||'',status:document.getElementById('f-status').value,cauzione:parseFloat(document.getElementById('f-cau').value)||0,url:document.getElementById('f-url').value||'',value:parseFloat(document.getElementById('f-val').value)||0,note:document.getElementById('f-note').value||''};
  if(editingAptId){const i=data.appartamenti.findIndex(x=>x.id===editingAptId);if(i>-1)data.appartamenti[i]=a;}
  else data.appartamenti.push(a);
  save();closeModal('apt');renders.appartamenti();renderMetrics();
}

function savePay(){
  data.pagamenti.push({id:data.nextId++,aptId:parseInt(document.getElementById('p-apt').value),amt:parseFloat(document.getElementById('p-amt').value)||0,date:document.getElementById('p-date').value,month:document.getElementById('p-month').value,note:document.getElementById('p-note').value});
  save();closeModal('pay');renders.pagamenti();renderMetrics();
}

function saveScad(){
  data.scadenze.push({id:data.nextId++,type:document.getElementById('s-type').value,aptId:parseInt(document.getElementById('s-apt').value),date:document.getElementById('s-date').value,note:document.getElementById('s-note').value});
  save();closeModal('scad');renders.scadenze();
}

function saveSpesa(){
  if(!data.spese)data.spese=[];
  data.spese.push({id:data.nextId++,desc:document.getElementById('sp-desc').value||'',amt:parseFloat(document.getElementById('sp-amt').value)||0,date:document.getElementById('sp-date').value,apt:aptLabel(parseInt(document.getElementById('sp-apt').value))});
  save();closeModal('spesa');renders.spese();
}

function sendWA(tel, nome){
  const now = new Date();
  const mese = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'][now.getMonth()];
  const msg = encodeURIComponent('Ciao ' + nome.split(' ')[0] + ', ti ricordo gentilmente la scadenza dell affitto per il mese di ' + mese + '. Grazie!');
  window.open('https://wa.me/39' + tel.replace(/\D/g,'') + '?text=' + msg);
}

function deletePay(id){if(confirm('Eliminare questo pagamento?')){data.pagamenti=data.pagamenti.filter(p=>p.id!==id);save();renders.pagamenti();renderMetrics();}}
function deleteScad(id){data.scadenze=data.scadenze.filter(s=>s.id!==id);save();renders.scadenze();}
function deleteSpesa(id){data.spese=data.spese.filter(s=>s.id!==id);save();renders.spese();}

document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)closeModal(el.id.replace('modal-',''));});
});

document.getElementById('fab').style.display='none';
showLoading(true);
cloudLoad().then(cloud=>{
  if(cloud&&cloud.appartamenti&&cloud.appartamenti.length>0){data=cloud;if(!data.spese)data.spese=[];}
  else{cloudSave(data);}
  showLoading(false);
  renderMetrics();
  renders.dashboard();
});
</script>
</body>
</html>
